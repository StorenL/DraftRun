<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · 潦草地</title>
    <meta name="description" content="{{DESC}}" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lc-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="潦草地" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESC}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <link rel="alternate" type="application/rss+xml" title="潦草地" href="https://draft.run/rss.xml" />    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">跳到正文</a>

    <header class="header" data-header>
      <div class="shell">
        <a class="brand" href="/" aria-label="潦草地">
          潦草地
          <svg class="brand__scratch" viewBox="0 0 90 10" preserveAspectRatio="none" aria-hidden="true">
            <path
              d="M2 6q11-5 22 0t22 0t22 0t20 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
            />
          </svg>
        </a>

        <nav class="nav" aria-label="主导航">
          <a href="/">文章</a>
          <a href="/#categories">分类</a>
          <a href="/#about">关于</a>
        </nav>

        <div class="header__tools">
          <button class="icon-btn" type="button" aria-label="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m19.5 19.5-4-4" />
            </svg>
          </button>
          <button class="icon-btn" type="button" data-theme-toggle aria-label="切换到暗色">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
            </svg>
          </button>
          <a class="icon-btn" href="/rss.xml" aria-label="RSS">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16" />
              <circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none" />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main id="main">
      <div class="wrap post-head">
        <p class="post-kicker">{{KICKER}}</p>
        <h1 class="post-title">{{TITLE}}</h1>
        <p class="post-dek">{{DEK}}</p>
        <p class="post-meta">
          {{META}}
        </p>
        <hr class="rule" />
      </div>

      <div class="wrap post-layout">
        <div class="post-main">
          <article class="prose">
            {{BODY}}

            <div class="post-end">
              <span class="avatar" aria-hidden="true">🌤️</span>
              <span>写于 {{DATE_CN}}，{{NOTE}}</span>
            </div>
          </article>
        </div>

        <aside class="post-aside">
          <nav class="toc" aria-label="本页目录">
            <h4>本页目录</h4>
            <ol>
              {{TOC}}
            </ol>
          </nav>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <svg class="footer__cloud" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 60V38 a100 38 0 0 1 200 0 a100 38 0 0 1 200 0 a100 38 0 0 1 200 0 a100 38 0 0 1 200 0 a100 38 0 0 1 200 0 a100 38 0 0 1 200 0V60Z" fill="currentColor" />
      </svg>
      <div class="shell">
        <div class="footer__bar">
          <p class="footer__copy">© 2026 潦草地</p>
          <p class="footer__note">
            Markdown 写作 · 静态输出 · 零依赖 ·
            <a href="/rss.xml">RSS 订阅</a>
          </p>
        </div>
      </div>
    </footer>

    <script>
      (function () {
        var themeBtn = document.querySelector("[data-theme-toggle]");
        function syncTheme() {
          if (!themeBtn) return;
          var dark = document.documentElement.dataset.theme === "dark";
          themeBtn.setAttribute("aria-label", dark ? "切换到亮色" : "切换到暗色");
        }
        if (themeBtn) {
          syncTheme();
          themeBtn.addEventListener("click", function () {
            var root = document.documentElement;
            var next = root.dataset.theme === "dark" ? "light" : "dark";
            // 只在切换的这一瞬间打开颜色过渡，避免影响平时的悬停
            root.classList.add("is-swapping");
            window.setTimeout(function () {
              root.classList.remove("is-swapping");
            }, 620);
            root.dataset.theme = next;
            try {
              localStorage.setItem("lc-theme", next);
            } catch (e) {}
            syncTheme();
          });
        }

        var header = document.querySelector("[data-header]");
        function onScroll() {
          header.classList.toggle("is-solid", window.scrollY > 24);
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();

        // 演示：行宽
        var demo = document.querySelector("[data-demo]");
        if (demo) {
          var stage = demo.querySelector("[data-stage]");
          var input = demo.querySelector("[data-in]");
          var out = demo.querySelector("[data-out]");
          var apply = function () {
            var n = Number(input.value);
            stage.style.maxWidth = n + "em";
            out.textContent = n;
          };
          input.addEventListener("input", apply);
          apply();
        }

        // 复制
        document.querySelectorAll("[data-copy]").forEach(function (btn) {
          var code = btn.closest(".code").querySelector("code");
          btn.addEventListener("click", function () {
            var text = code.innerText;
            var done = function () {
              btn.textContent = "已复制";
              setTimeout(function () {
                btn.textContent = "复制到剪贴板";
              }, 1500);
            };
            if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(done, done);
            } else {
              done();
            }
          });
        });

        // 目录高亮
        var links = document.querySelectorAll(".toc a");
        function spy() {
          var y = window.scrollY + 160;
          var current = null;
          links.forEach(function (a) {
            var el = document.getElementById(a.getAttribute("href").slice(1));
            if (el && el.getBoundingClientRect().top + window.scrollY <= y) {
              current = a;
            }
          });
          links.forEach(function (a) {
            a.classList.toggle("is-active", a === current);
          });
        }
        window.addEventListener("scroll", spy, { passive: true });
        spy();
      })();
    </script>
    <script>
      // 目录高亮：跟随滚动标出当前小节
      (function () {
        var links = Array.prototype.slice.call(
          document.querySelectorAll(".post-aside .toc a")
        );
        if (!links.length || !("IntersectionObserver" in window)) return;
        var byId = {};
        links.forEach(function (a) {
          byId[a.getAttribute("href").slice(1)] = a;
        });
        var current = null;
        var obs = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              var a = byId[e.target.id];
              if (!a || a === current) return;
              if (current) current.classList.remove("is-active");
              a.classList.add("is-active");
              current = a;
            });
          },
          { rootMargin: "-15% 0px -70% 0px", threshold: 0 }
        );
        document.querySelectorAll(".prose h2[id]").forEach(function (h) {
          obs.observe(h);
        });
      })();
    </script>
  </body>
</html>
