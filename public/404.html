<!doctype html>
<html lang="zh-CN" data-js="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · 潦草地</title>
    <meta
      name="description"
      content="页面不存在。"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lc-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .page-404 {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-top: calc(var(--header-h) + 40px);
        padding-bottom: 80px;
        text-align: center;
      }
      .footer {
        margin-top: 0;
      }
      .page-404 .post-kicker { letter-spacing: 0.3em; }
      .page-404__back { margin: 32px 0 0; }
      .page-404__back .readmore { gap: 10px; }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main">跳到正文</a>

              <circle cx="12" cy="12" r="4" />
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />

    </footer>

    <script>
      (function () {
        var themeBtn = document.querySelector("[data-theme-toggle]");
        function syncTheme() {
          if (!themeBtn) return;
          var dark = document.documentElement.dataset.theme === "dark";
          themeBtn.setAttribute("aria-label", dark ? "切换到亮色" : "切换到暗色");
        }
        if (themeBtn) {
          syncTheme();
          themeBtn.addEventListener("click", function () {
            var next =
              document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = next;
            try {
              localStorage.setItem("lc-theme", next);
            } catch (e) {}
            syncTheme();
          });
        }

        var header = document.querySelector("[data-header]");
        function onScroll() {
          header.classList.toggle("is-solid", window.scrollY > 20);
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();

        var items = document.querySelectorAll("[data-reveal]");
        if ("IntersectionObserver" in window) {
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) {
                  e.target.classList.add("is-in");
                  io.unobserve(e.target);
                }
              });
            },
            { rootMargin: "0px 0px -10% 0px" }
          );
          items.forEach(function (el) {
            io.observe(el);
          });
        } else {
          items.forEach(function (el) {
            el.classList.add("is-in");
          });
        }
      })();
    </script>
    <script>
    // 标题下划线从鼠标进入点向两侧展开
    document.querySelectorAll(".post-item h3 a").forEach(function (a) {
      a.addEventListener("pointerenter", function (e) {
        var r = a.getBoundingClientRect();
        var ox = ((e.clientX - r.left) / r.width) * 100;
        a.style.setProperty("--ox", Math.max(0, Math.min(100, ox)) + "%");
      });
    });
  </script></body>
